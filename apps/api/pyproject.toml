[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-analysis-agent-api"
version = "0.1.0"
description = "Backend API for the sales analysis agent"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "pandas>=2.2,<3",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "jupyter-client>=8.6,<9",
  "ipykernel>=6.29,<7",
  "httpx>=0.28,<1",
  "PyYAML>=6.0,<7",
  "plotly>=6.0,<7",
  "matplotlib>=3.10,<4",
  "seaborn>=0.13,<1",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
